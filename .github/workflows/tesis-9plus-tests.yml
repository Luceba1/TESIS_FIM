name: Tesis 9+ regression tests

on:
  push:
    branches: [tesis-9plus-final-pass]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Run integrity and metrics regression suites
        env:
          PYTHONPATH: .
        run: pytest -v tests/test_fim_integrity.py tests/test_metrics_separation.py
